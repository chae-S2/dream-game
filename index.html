<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>꿈 DREAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=DotGothic16&display=swap">
<style>
/* Game UI: 픽셀 테두리 게임 창 — 남색 바탕, 흰 테두리, 라일락 바깥선 */
:root {
  --ink: #F4F1FF;
  --ink-2: #CFCAF0;
  --night: #14163A;
  --win: #1E2154;
  --win-2: #2A2E6C;
  --edge: #F4F1FF;
  --edge-2: #8F86D9;
  --pink: #F49AC1;
  --star: #F6DD8A;
  --violet: #AB9BEF;
  --pix: 'DotGothic16', 'Gowun Dodum', monospace;
  --ui: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
  --title: 'Gowun Batang', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; color: var(--ink); font-family: var(--ui); word-break: keep-all; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 55%, rgba(14,14,44,.55) 100%); }
.scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }

/* 공통 게임 창 */
.win { position: relative; background: linear-gradient(180deg, var(--win-2), var(--win)); border: 3px solid var(--edge); box-shadow: 0 0 0 3px var(--edge-2), 0 0 0 6px #141638, 6px 8px 0 6px rgba(8,8,28,.45); border-radius: 3px; }
.win::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(171,155,239,.35); pointer-events: none; }
.pbtn { font-family: var(--ui); color: var(--ink); cursor: pointer; background: var(--win-2); border: 2px solid var(--edge); border-radius: 3px; box-shadow: 0 4px 0 #0E1030, inset 0 2px 0 rgba(255,255,255,.12); transition: transform .08s, box-shadow .08s, background .2s; }
.pbtn:hover { background: #3A3F8A; }
.pbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0E1030, inset 0 2px 0 rgba(255,255,255,.12); }
.pbtn:focus-visible { outline: 2px solid var(--star); outline-offset: 3px; }

#fade { position: fixed; inset: 0; background: #0E0F2C; opacity: 1; pointer-events: none; transition: opacity .9s ease; z-index: 40; }
#fade.white { background: #FFFFFF; transition: opacity 2.4s ease; }

/* 컷 라벨 */
#cut { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(18px, calc(env(safe-area-inset-left, 0px) + 10px)); z-index: 20; display: flex; align-items: stretch; opacity: 0; transform: translateX(-12px); transition: opacity .6s, transform .6s; pointer-events: none; }
#cut.on { opacity: 1; transform: none; }
#cut .no { font-family: var(--pix); font-size: 12px; letter-spacing: .12em; background: var(--pink); color: #2A1840; padding: 6px 9px; display: grid; place-items: center; border: 3px solid var(--edge); border-right: 0; }
#cut .t { font-family: var(--title); font-size: 17px; padding: 5px 14px 6px; background: var(--win); border: 3px solid var(--edge); box-shadow: 4px 4px 0 rgba(8,8,28,.45); }

/* 대화창 */
#caption { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); z-index: 20; width: min(680px, calc(100vw - 36px)); min-height: 76px; padding: 16px 44px 18px 22px; font-size: clamp(15px, 2vw, 18px); line-height: 1.65; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
#caption.on { opacity: 1; transform: translate(-50%, 0); }
#caption .more { position: absolute; right: 16px; bottom: 10px; font-size: 12px; color: var(--star); animation: bob 1s ease-in-out infinite; opacity: 0; }
#caption.done .more { opacity: 1; }
@keyframes bob { 50% { transform: translateY(3px); } }
@media (pointer: coarse) { #caption { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); } }

/* 조사하기 말풍선 */
#prompt { position: fixed; z-index: 15; transform: translate(-50%, calc(-100% - 10px)); padding: 6px 12px 7px 8px; font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; cursor: pointer; display: flex; align-items: center; gap: 8px; }
#prompt.on { opacity: 1; pointer-events: auto; animation: hop 1.4s ease-in-out infinite; }
@keyframes hop { 50% { margin-top: -3px; } }
#prompt::after { content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--edge); }
#prompt kbd { font-family: var(--pix); display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 3px; background: var(--star); color: #2A1840; font-size: 12px; box-shadow: 0 2px 0 #9C7F2E; }

/* HUD */
#hud { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(18px, calc(env(safe-area-inset-right, 0px) + 10px)); z-index: 20; display: flex; gap: 12px; align-items: stretch; }
#hud .bag { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 10px; }
#hud .lbl { font-family: var(--pix); font-size: 11px; letter-spacing: .1em; color: var(--violet); margin-right: 2px; }
#hud .slot { width: 30px; height: 30px; border: 2px solid rgba(171,155,239,.45); background: rgba(10,10,34,.5); display: grid; place-items: center; font-size: 15px; color: rgba(255,255,255,.2); transition: all .5s; border-radius: 2px; }
#hud .slot.got { border-color: var(--star); color: var(--star); background: rgba(246,221,138,.16); box-shadow: 0 0 12px rgba(246,221,138,.5); }
#mute { width: 44px; font-size: 15px; }
#hud .bag { opacity: 0; transition: opacity .8s; } body.playing #hud .bag { opacity: 1; }

/* 인벤토리 */
#inv { position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 10px)); top: calc(76px + env(safe-area-inset-top, 0px)); padding: 8px 10px 9px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transform: translateX(10px); transition: opacity .4s, transform .4s; pointer-events: none; }
#inv.on { opacity: 1; transform: none; pointer-events: auto; }
#inv .lbl { font-family: var(--pix); font-size: 11px; letter-spacing: .1em; color: var(--violet); }
#inv .slots { display: flex; flex-direction: column; gap: 6px; }
#inv .islot { width: 46px; height: 46px; padding: 6px; border: 2px solid rgba(171,155,239,.5); background: rgba(10,10,34,.55); border-radius: 3px; cursor: pointer; display: grid; place-items: center; transition: transform .15s, border-color .2s, background .2s; }
#inv .islot:disabled { cursor: default; opacity: .35; }
#inv .islot svg { width: 100%; height: 100%; }
#inv .islot:not(:disabled):hover { transform: scale(1.06); }
#inv .islot.sel { border-color: var(--star); background: rgba(246,221,138,.18); box-shadow: 0 0 0 2px rgba(246,221,138,.35), 0 0 14px rgba(246,221,138,.45); }
#inv .islot.new { animation: got .8s ease-out; }
@keyframes got { 0% { transform: scale(1.5); background: rgba(246,221,138,.5); } }
#inv .name { font-size: 11px; color: var(--ink-2); max-width: 70px; text-align: center; line-height: 1.35; min-height: 15px; }
@media (max-width: 560px) { #inv { top: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); } #inv .slots { flex-direction: row; } #inv .islot { width: 40px; height: 40px; } #inv .name { max-width: none; } }

/* 타이틀 */
#title { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: calc(12vh + env(safe-area-inset-bottom, 0px)); gap: 10px; text-align: center; cursor: pointer; transition: opacity 1s; }
#title.gone { opacity: 0; pointer-events: none; }
#title h1 { margin: 0; font-family: var(--title); font-weight: 700; font-size: clamp(72px, 13vw, 128px); line-height: 1; text-shadow: 0 0 40px rgba(222,185,251,.6), 4px 4px 0 rgba(20,22,58,.6); }
#title .sub { font-family: var(--pix); font-size: 13px; letter-spacing: .6em; color: var(--ink-2); padding-left: .6em; }
#title .menu { margin-top: 22px; padding: 12px 26px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
#title .menu .start { font-family: var(--pix); font-size: 15px; letter-spacing: .2em; color: var(--star); }
#title .menu .start::before { content: "▶ "; animation: blink 1s steps(2, start) infinite; }
#title .help { margin-top: 14px; font-size: 12px; color: var(--ink-2); line-height: 1.9; }
#title .help b { font-family: var(--pix); font-weight: 400; color: var(--ink); border: 1px solid rgba(244,241,255,.5); padding: 0 5px; border-radius: 2px; }
@keyframes blink { 50% { opacity: 0; } }

/* 퍼즐 창 */
#panel { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(12,12,40,.5); opacity: 0; pointer-events: none; transition: opacity .25s; padding: 24px; }
#panel.on { opacity: 1; pointer-events: auto; }
#panel.on .card { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.card { width: min(560px, 100%); padding: 0 22px 20px; text-align: center; }
.card h2 { margin: 0 -22px 0; padding: 9px 16px 10px; font-family: var(--title); font-size: 19px; font-weight: 700; background: linear-gradient(90deg, #6E62C9, #A97FC8); border-bottom: 3px solid var(--edge); text-shadow: 2px 2px 0 rgba(20,22,58,.5); }
.card p.hint { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.7; }
.row { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.cell, .opt, .bigbtn, .tok, .sl { display: grid; place-items: center; font-size: 26px; transition: all .2s; }
.cell { width: 52px; height: 52px; border: 2px solid rgba(171,155,239,.5); background: rgba(10,10,34,.5); border-radius: 3px; }
.cell.q { border: 2px dashed var(--pink); color: var(--pink); }
.cell.ok { border-color: var(--star); color: var(--star); box-shadow: 0 0 16px rgba(246,221,138,.5); }
button.opt, button.bigbtn, button.tok, button.sl, button.close, button.ctl { font-family: var(--ui); color: var(--ink); cursor: pointer; }
.opt, .tok, .ctl { background: var(--win-2); border: 2px solid var(--edge); border-radius: 3px; box-shadow: 0 4px 0 #0E1030; }
.opt { width: 60px; height: 60px; }
.opt:hover, .tok:hover, .ctl:hover { background: #3A3F8A; }
.opt:active, .tok:active, .ctl:active { transform: translateY(3px); box-shadow: 0 1px 0 #0E1030; }
.opt.wrong, .bigbtn.wrong, .sl.wrong, .clockface.wrong, .cell.wrong { animation: shake .4s; border-color: #FF8FA8; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.bigbtn { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--edge); background: radial-gradient(circle at 40% 35%, #4A4F9A, #2A2E6C); font-family: var(--pix) !important; font-size: 18px; color: var(--ink-2); box-shadow: 0 5px 0 #0E1030; }
.bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0E1030; }
.bigbtn.lit { background: radial-gradient(circle, #FFF2F9, var(--pink)); color: #2A1840; box-shadow: 0 5px 0 #8E4D73, 0 0 30px rgba(244,154,193,.8); }
.bigbtn:disabled { cursor: default; }
.status { margin-top: 16px; font-size: 14px; color: var(--star); min-height: 22px; }
.close { margin-top: 10px; background: none; border: 0; color: var(--ink-2); font-size: 13px; }
.close::before { content: "✕ "; }
.staff { position: relative; margin: 20px auto 0; width: 100%; max-width: 420px; height: 120px; }
.staff i { position: absolute; left: 0; right: 0; height: 2px; background: rgba(222,185,251,.4); }
.staff .slots { position: absolute; inset: 0; display: flex; justify-content: space-around; align-items: center; padding-left: 40px; }
.staff .clef { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); font-family: 'Apple Symbols', 'Noto Music', 'Segoe UI Symbol', serif; font-size: 70px; color: var(--violet); line-height: 1; }
.sl { width: 58px; height: 58px; border: 2px dashed rgba(171,155,239,.6); background: rgba(14,15,44,.85); color: rgba(255,255,255,.35); border-radius: 3px; }
.sl.filled { border-style: solid; border-color: var(--star); color: var(--star); box-shadow: 0 0 16px rgba(246,221,138,.45); }
.tok { min-width: 116px; height: 50px; padding: 0 14px; gap: 8px; grid-auto-flow: column; font-size: 14px; }
.tok b { font-size: 20px; color: var(--star); font-weight: 400; }
.tok.sel { border-color: var(--star); background: #4A4590; box-shadow: 0 4px 0 #0E1030, 0 0 0 3px rgba(246,221,138,.35); }
.tok.used { opacity: .25; pointer-events: none; }
.sym { width: 64px; height: 64px; }
.clockwrap { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.clockface { width: 170px; height: 170px; border-radius: 50%; border: 3px solid var(--edge); background: radial-gradient(circle, #FBF7FF, #E4DBFA); box-shadow: 0 0 0 4px var(--edge-2), 0 6px 0 4px #0E1030; }
.clockface.ok { box-shadow: 0 0 0 4px var(--star), 0 0 30px rgba(246,221,138,.7); }
.ctlgrid { display: grid; grid-template-columns: auto 44px auto; gap: 8px 10px; align-items: center; font-size: 14px; color: var(--ink-2); }
.ctlgrid span.v { font-family: var(--pix); font-size: 18px; color: var(--ink); text-align: center; }
.ctl { width: 40px; height: 36px; font-size: 14px; }
.go { margin-top: 18px; padding: 10px 26px; font-size: 15px; }

/* 터치 버튼 (DS 버튼 느낌) */
#touch { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 22; display: none; justify-content: space-between; padding: 0 max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#touch .grp { display: flex; gap: 10px; pointer-events: auto; }
#touch button { width: 60px; height: 60px; border-radius: 6px; border: 3px solid var(--edge); background: var(--win-2); color: var(--ink); font-size: 20px; font-family: var(--pix); touch-action: none; box-shadow: 0 5px 0 #0E1030; }
#touch button:active { transform: translateY(3px); box-shadow: 0 2px 0 #0E1030; }
#touch button.e { border-radius: 50%; background: var(--pink); color: #2A1840; font-weight: 700; box-shadow: 0 5px 0 #8E4D73; }
@media (pointer: coarse) { #touch { display: flex; } }

#endcard { position: fixed; inset: 0; z-index: 45; background: #08091E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; opacity: 0; pointer-events: none; transition: opacity 2s; text-align: center; }
#endcard.on { opacity: 1; pointer-events: auto; }
#endcard h2 { margin: 0; font-family: var(--title); font-size: 64px; text-shadow: 0 0 30px rgba(222,185,251,.5); }
#endcard p { margin: 0; color: var(--ink-2); font-size: 13px; letter-spacing: .12em; }
#endcard p.pix { font-family: var(--pix); letter-spacing: .4em; color: var(--violet); }
#endcard button { margin-top: 22px; padding: 10px 24px; font-size: 15px; }
#err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 30px; z-index: 99; background: var(--night); line-height: 1.8; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="vignette"></div><div class="scan"></div>

<div id="cut"><span class="no"></span><span class="t"></span></div>
<div id="hud"><div class="bag win" aria-label="모은 소리"><span class="lbl">SOUND</span><span class="slot" data-k="star">★</span><span class="slot" data-k="tri">△</span><span class="slot" data-k="circ">○</span></div><button id="mute" class="pbtn" aria-label="소리 끄기/켜기">♪</button></div>
<div id="inv" class="win"><span class="lbl">ITEM</span><div class="slots"></div><span class="name"></span></div>
<div id="caption" class="win"><span class="txt"></span><span class="more">▼</span></div>
<div id="prompt" class="win"><kbd>E</kbd><span></span></div>
<div id="panel"><div class="card win" id="card"></div></div>

<div id="title">
  <span class="sub">DREAM</span>
  <h1>꿈</h1>
  <div class="menu win"><span class="start">PRESS START</span></div>
  <span class="help"><b>← →</b> <b>A D</b> 걷기 &nbsp; <b>E</b> <b>SPACE</b> 조사하기<br>화면을 눌러 걷고, 말풍선을 눌러 조사할 수도 있어요</span>
</div>

<div id="touch"><div class="grp"><button data-k="left" aria-label="왼쪽">◀</button><button data-k="right" aria-label="오른쪽">▶</button></div><div class="grp"><button class="e" data-k="use" aria-label="조사하기">E</button></div></div>
<div id="endcard"><p class="pix">DREAM</p><h2>꿈</h2><p>플레이해 주셔서 고마워요</p><p>AI 융합디자인 · 조영채</p><button id="again" class="pbtn">▶ 처음부터</button></div>
<div id="fade"></div>
<div id="err">게임을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>

<script>
window.__showErr = function (m) { var e = document.getElementById('err'); e.style.display = 'grid'; e.innerHTML = '게임을 불러오지 못했어요.<br><small style="opacity:.7;font-size:12px">' + String(m).replace(/</g, '&lt;') + '</small>'; };
addEventListener('error', function (e) { __showErr((e.message || '') + ' @' + (e.lineno || '')); });
addEventListener('unhandledrejection', function (e) { __showErr(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
</script>
<script type="module">

// 꿈 DREAM — 2.5D 로우폴리 퍼즐 어드벤처 (프로토타입)
// 스토리보드 25컷 기준: 침실 → 계단 → 세 갈래 길 → 별/도형/버튼 → 합류 → 공중 → 높은음자리표 → 침실

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js');
} catch (e) {
  window.__showErr('three.js 로드 실패: ' + e.message);
  throw e;
}

/* ───────────── 색 ───────────── */
const C = {
  deep: 0x6D7BA9, grey: 0x777EB1, lav: 0x908CD1, lilac: 0xAB9BEF, pink: 0xDEB9FB,
  hot: 0xF49AC1, star: 0xF6DD8A, cream: 0xF4EEFF, night: 0x1B1E4A, wall: 0xB9B4E6, floor: 0x9C97D6,
};

/* ───────────── 렌더러 (저해상도 → 픽셀 느낌) ───────────── */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
let world = new THREE.Scene();

function resize() {
  const w = innerWidth, h = innerHeight;
  const targetH = 300;                          // DS 느낌의 낮은 세로 해상도
  const s = Math.max(1, h / targetH);
  renderer.setSize(Math.round(w / s), Math.round(h / s), false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ───────────── 공용 텍스처 ───────────── */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX = {
  glow: canvasTex(128, 128, (g, w) => {
    const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,240,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, w);
  }),
  moon: canvasTex(256, 256, (g) => {
    g.fillStyle = '#FFF6FF'; g.shadowColor = '#F7D9FF'; g.shadowBlur = 30;
    g.beginPath(); g.arc(128, 128, 80, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = 'destination-out'; g.shadowBlur = 0;
    g.beginPath(); g.arc(168, 104, 74, 0, Math.PI * 2); g.fill();
  }),
  clef: canvasTex(256, 512, (g) => {
    g.strokeStyle = '#F4E9FF'; g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = '#E6C8FF'; g.shadowBlur = 24; g.lineWidth = 16;
    g.beginPath();
    g.moveTo(140, 470); g.bezierCurveTo(90, 480, 80, 420, 120, 410);
    g.bezierCurveTo(150, 405, 155, 440, 135, 450);
    g.moveTo(140, 470); g.lineTo(150, 60);
    g.bezierCurveTo(152, 20, 200, 30, 190, 80);
    g.bezierCurveTo(180, 140, 70, 200, 60, 280);
    g.bezierCurveTo(50, 360, 160, 390, 200, 330);
    g.bezierCurveTo(235, 280, 190, 220, 140, 240);
    g.bezierCurveTo(100, 255, 105, 310, 140, 315);
    g.stroke();
  }),
};
function at(o, x, y, z) { o.position.set(x, y, z); return o; }
function glowSprite(color, size, opacity = .9) {
  const m = new THREE.SpriteMaterial({ map: TEX.glow, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending });
  const s = new THREE.Sprite(m); s.scale.set(size, size, 1); return s;
}

/* ───────────── 지오메트리 도우미 ───────────── */
const mats = new Map();
function mat(color, opts = {}) {
  const { unique, ...rest } = opts;
  const key = color + JSON.stringify(rest);
  if (!unique && mats.has(key)) return mats.get(key);
  const m = new THREE.MeshLambertMaterial({ color, flatShading: true, ...rest });
  if (!unique) mats.set(key, m);
  return m;
}
function box(g, w, h, d, color, x, y, z, opts) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
  m.position.set(x, y, z); g.add(m); return m;
}
function cyl(g, rt, rb, h, seg, color, x, y, z, opts) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(color, opts));
  m.position.set(x, y, z); g.add(m); return m;
}
function rock(g, r, color, x, y, z, sy = 1) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), mat(color));
  m.position.set(x, y, z); m.scale.y = sy; m.rotation.set(Math.random() * 3, Math.random() * 3, 0); g.add(m); return m;
}
function starShape(r = .5, inner = .22) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? inner : r;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? s.lineTo(px, py) : s.moveTo(px, py);
  }
  s.closePath(); return s;
}
function polyShape(n, r, rot = Math.PI / 2) {
  const s = new THREE.Shape();
  for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  s.closePath(); return s;
}
function extrude(shape, depth, color, opts) {
  return new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }), mat(color, opts));
}
// 크리스탈 별: 앞뒤로 뾰족한 3D 별 (면마다 밝기가 달라 보석처럼 보임)
function crystalStarGeo(r) {
  const inner = r * .46, d = r * .42, pos = [], col = [];
  const pts = Array.from({ length: 10 }, (_, i) => { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? inner : r; return [Math.cos(a) * rr, Math.sin(a) * rr, 0]; });
  const F = [0, 0, d], B = [0, 0, -d];
  for (let i = 0; i < 10; i++) {
    const a = pts[i], b = pts[(i + 1) % 10];
    const lf = i % 2 ? 1 : .78, lb = i % 2 ? .62 : .5;
    pos.push(...F, ...a, ...b); col.push(1, 1, 1, lf, lf, lf, lf, lf, lf);
    pos.push(...B, ...b, ...a); col.push(.8, .8, .8, lb, lb, lb, lb, lb, lb);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals(); return g;
}
function crystalStar(size, color = 0xFFE7A0) {
  const grp = new THREE.Group();
  const m = new THREE.Mesh(crystalStarGeo(size), new THREE.MeshStandardMaterial({ color, vertexColors: true, flatShading: true, metalness: .15, roughness: .12, emissive: color, emissiveIntensity: .45, transparent: true, opacity: .95 }));
  grp.add(m);
  const halo = glowSprite(0xFFF0C0, size * 4.2, .55); grp.add(halo);
  const tw = glowSprite(0xFFFFFF, size * 1.6, .9); tw.position.z = size * .5; grp.add(tw);
  grp.userData = { core: m, halo, tw };
  return grp;
}
// 별 모양 홈: 짙게 파인 별 + 금빛 테두리
function starHole(size) {
  const grp = new THREE.Group();
  const inset = new THREE.Mesh(new THREE.ShapeGeometry(starShape(size, size * .46)), new THREE.MeshBasicMaterial({ color: 0x4A4C80 }));
  grp.add(inset);

  c.fillStyle = '#F6DD8A'; c.shadowColor = '#FFE9A8'; c.shadowBlur = 10;

  openPanel(`<h2>선율 완성</h2><p class="hint">소리를 고른 뒤, 같은 모양의 칸에 넣어 주세요.</p>
    <div class="staff">${[0, 1, 2, 3, 4].map(i => `<i style="top:${22 + i * 19}px"></i>`).join('')}<span class="clef">𝄞</span>
      <div class="slots">${slots.map((k, i) => `<button class="sl" data-k="${k}" aria-label="${k} 칸">${SYM[k]}</button>`).join('')}</div></div>
    <div class="row">${toks.map(t => `<button class="tok" data-k="${t.k}"><b>${SYM[t.k]}</b>${t.n}</button>`).join('')}</div>
    <div class="status"></div><button class="close">닫기</button>`);
  const st = card.querySelector('.status');
  card.querySelector('.close').onclick = closePanel;
  card.querySelectorAll('.tok').forEach(t => t.onclick = () => {
    card.querySelectorAll('.tok').forEach(x => x.classList.remove('sel')); t.classList.add('sel'); sel = t.dataset.k; SND[sel]();
  });
  card.querySelectorAll('.sl').forEach(s => s.onclick = async () => {
    if (!sel || s.classList.contains('filled')) { if (!sel) st.textContent = '먼저 아래에서 소리를 골라 주세요.'; return; }
    if (s.dataset.k !== sel) { SND.wrong(); s.classList.add('wrong'); st.textContent = '모양이 맞지 않아요.'; await wait(400); s.classList.remove('wrong'); return; }
    s.classList.add('filled'); card.querySelector(`.tok[data-k="${sel}"]`).classList.add('used'); sel = null; filled++; st.textContent = ''; SND.blip();
    if (filled < 3) return;
    st.textContent = '선율이 완성되었다.'; cut('CUT 23', '선율 완성'); melody();
    await wait(1600); closePanel(); S.melody = true; notes.forEach(n => n.visible = true); stair.visible = true;
    caption('완성된 선율이 공간을 채운다. 오른쪽에 계단이 나타났다.', 4000);
  });
}
async function ascend() {
  S.locked = true; caption('', 1);
  const startY = camera.position.y; const t0 = performance.now();
  S.ascending = { t0, startY };
  melody();
  await wait(5200);
  await fadeOut(true);
  await wait(1500);
  go('ending', true);
}

SCENES.ending = {
  bg: 0x6E73A0, sky: PASTEL_SKY, fog: [0x666C9E, 13, 34], light: [.95, .6],
  build(g) {
    const def = SCENES.bedroom.build(g, { heart: true, clock: false, ending: true });
    // 잠든 소녀
    const sleeper = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.75), new THREE.MeshBasicMaterial({ map: girlTex.back, transparent: true, alphaTest: .35 }));
    sleeper.rotation.set(-Math.PI / 2.4, 0, Math.PI / 2); sleeper.position.set(-3.8, 1.05, -2.5); g.add(sleeper);
    return {
      bounds: [-3.8, -3.8], spawn: -3.8, hidePlayer: true, cam: { x: -2.4, yOff: 2.4, z: 9, ly: 1.3 },
      items: [], update: def.update,
      onEnter: async () => {
        cut('CUT 24', '처음의 침실로'); caption('원래의 침실로 돌아왔다.', 3200);
        tone(98, { dur: 6, vol: .08, attack: 2, cutoff: 400 });
        await wait(3600);
        sleeper.material.map = girlTex.front; sleeper.rotation.set(0, 0, 0); sleeper.position.set(-2.4, .9, -.8); sleeper.scale.setScalar(1);
        cut('CUT 25', '꿈에서 깨어나다'); caption('꿈이 끝나고, 눈을 뜬다.', 4000);
        melody();
        await wait(5200);
        $('#endcard').classList.add('on');
      },
    };
  },
};

/* ───────────── 장면 전환 ───────────── */
let transitioning = false;
async function go(name, skipFade) {
  if (transitioning) return; transitioning = true; S.locked = true;
  if (S.scene && ROOMS.some(r => r.id === S.scene)) S.lastRoom = S.scene;
  if (name === 'stairs' || name === 'sky') S.lastRoom = null;
  if (!skipFade) await fadeOut();
  load(name);
  await fadeIn();
  transitioning = false; S.locked = !!S.def.hidePlayer;
  S.def.onEnter?.();
}
function load(name) {
  world = new THREE.Scene();
  const meta = SCENES[name];
  S.anim = [];
  world.background = meta.sky ? skyTex(meta.sky) : new THREE.Color(meta.bg);
  world.fog = new THREE.Fog(...meta.fog);
  const [hb, sb] = meta.light || [1.15, .9]; S.hemiBase = hb; S.sunBase = sb;
  S.hemi = new THREE.HemisphereLight(0xF6EEFF, 0x6C6AB0, hb); world.add(S.hemi);
  S.sun = new THREE.DirectionalLight(0xFFF0FA, sb); S.sun.position.set(-4, 8, 6); world.add(S.sun);
  const g = new THREE.Group(); world.add(g);
  S.scene = name; S.def = meta.build(g, S);
  S.x = S.def.spawn; S.vx = 0; S.target = null;
  S.inv = []; S.sel = null; invRender(); S.y = S.def.floor ? (S.def.floor(S.x) ?? 0) : 0;
  player.visible = !S.def.hidePlayer; world.add(player);
  S.ascending = null;
  snapCamera();
}

/* ───────────── 입력 ───────────── */
const keymap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', (e) => {
  if (!S.started && e.key === '9') { S.started = true; audio(); document.body.classList.add('playing'); $('#title').classList.add('gone'); S.heart = S.clock = true; go('hub'); return; }   // 테스트용: 갈림길로 바로
  if (S.started && e.key === '9' && !transitioning && !panel.classList.contains('on')) { S.heart = S.clock = true; go('hub'); return; }   // 테스트용
  if (!S.started) { start(); return; }
  if (keymap[e.key]) { S.keys[keymap[e.key]] = true; e.preventDefault(); }
  if (['e', 'E', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); if (panel.classList.contains('on')) return; use(); }
  if (e.key === 'Escape' && panel.classList.contains('on')) closePanel();
});
addEventListener('keyup', (e) => { if (keymap[e.key]) S.keys[keymap[e.key]] = false; });
$('#title').addEventListener('pointerdown', () => !S.started && start());
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!S.started) return start(); if (k === 'use') use(); else S.keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => { if (k !== 'use') S.keys[k] = false; }));
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), walkPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -.6), hit = new THREE.Vector3();
canvas.addEventListener('pointerdown', (e) => {
  if (!S.started || S.locked || panel.classList.contains('on')) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(walkPlane, hit)) {
    if (nearest && Math.abs(hit.x - S.x) < .8) { use(); return; }
    S.target = hit.x;
  }
});
promptEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); use(); });
$('#again').addEventListener('click', () => location.reload());

let nearest = null;
function use() {
  if (S.locked || !nearest) return; SND.blip();
  if (S.sel && !(nearest.accepts || []).includes(S.sel)) { caption(`${ITEMS[S.sel].name}은(는) 여기에 쓸 수 없을 것 같다.`, 2200); S.sel = null; invRender(); return; }
  const it = S.sel; nearest.use(it);
}

async function start() {
  if (S.started) return; S.started = true;
  audio(); document.body.classList.add('playing');
  $('#title').classList.add('gone');
  cut('CUT 01', '달'); caption('꿈의 시작.', 2400);
  await wait(3000);
  await fadeOut();
  load('bedroom');
  await fadeIn();
  cut('CUT 02', '잠든 방'); caption('잠들어 있던 아이가 이상한 기운에 눈을 떴다. 시계가 멈춰 있고, 문은 열리지 않는다.', 3800);
  await wait(1200);
  S.locked = false;
  setTimeout(() => cut('CUT 03', '눈을 뜨다'), 3400);
}

/* ───────────── 카메라 ───────────── */
function camTarget() {
  const c = S.def?.cam || {};
  const [b0, b1] = S.def?.bounds || [0, 0];
  const lo = b0 + 3.2, hi = b1 - 3.2;
  const x = c.x ?? (hi < lo ? (b0 + b1) / 2 : Math.min(Math.max(S.x, lo), hi));
  const y = (c.y ?? (S.y + (c.yOff ?? 2.3)));
  const zk = Math.max(1, Math.pow(1.35 / camera.aspect, .75));
  return { x, y: y + (zk - 1) * 1.2, z: (c.z ?? 11) * zk, lx: x, ly: c.ly ?? (S.y + 1.25) };
}
const camLook = new THREE.Vector3();
function snapCamera() { const t = camTarget(); camera.position.set(t.x, t.y, t.z); camLook.set(t.lx, t.ly, 0); camera.lookAt(camLook); }

/* ───────────── 루프 ───────────── */
const v3 = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; S.t += dt;
  const d = S.def;
  if (d) {
    // 이동
    let dir = (!S.locked && !panel.classList.contains('on')) ? (S.keys.right ? 1 : 0) - (S.keys.left ? 1 : 0) : 0;
    if (dir) S.target = null;
    else if (S.target != null && !S.locked && !panel.classList.contains('on')) {
      const diff = S.target - S.x;
      if (Math.abs(diff) < .12 || (diff > 0 && S.x >= d.bounds[1]) || (diff < 0 && S.x <= d.bounds[0])) S.target = null; else dir = Math.sign(diff) * Math.min(1, Math.abs(diff) * 2 + .3);
    }
    S.vx += ((dir * 3.2) - S.vx) * Math.min(1, dt * 10);
    S.x = Math.min(d.bounds[1], Math.max(d.bounds[0], S.x + S.vx * dt));
    const fy = d.floor ? d.floor(S.x) : 0;
    S.y += ((fy ?? S.y) - S.y) * Math.min(1, dt * 12);
    if (Math.abs(S.vx) > .2) S.face = Math.sign(S.vx);
    const moving = Math.abs(S.vx) > .3;
    girlMat.map = moving ? girlTex.side : girlTex.front;   // 원본 옆모습은 왼쪽을 봄
    girl.scale.x = moving && S.face > 0 ? -1 : 1;
    girl.position.y = .87 + (moving ? Math.abs(Math.sin(S.t * 9)) * .06 : Math.sin(S.t * 2) * .015);
    player.position.set(S.x, S.y, .6);

    // 상호작용 대상
    nearest = null;
    if (!S.locked && !panel.classList.contains('on')) {
      let best = 1e9;
      for (const it of d.items || []) {
        if (it.cond && !it.cond()) continue;
        const dd = Math.abs(it.x - S.x);
        if (dd < it.r && dd < best) { best = dd; nearest = it; }
      }
    }
    if (nearest) {
      v3.set(S.x, S.y + 2.05, .6).project(camera);
      promptEl.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px';
      promptEl.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
      promptEl.querySelector('span').textContent = S.sel && (nearest.accepts || []).includes(S.sel) ? `${ITEMS[S.sel].name} 쓰기` : (S.sel ? `${ITEMS[S.sel].name} 들고 ${nearest.label}` : nearest.label);
      promptEl.classList.add('on');
    } else promptEl.classList.remove('on');

    d.update?.(dt);
    for (const f of S.anim) f(dt);

    // 카메라 따라가기
    const t = camTarget();
    if (S.ascending) {
      const k = Math.min(1, (now - S.ascending.t0) / 5000);
      t.y = S.ascending.startY + k * k * 22; t.ly = t.y + 2 + k * 6; t.z = 11 + k * 6;
      player.position.y += k * 2; S.x = Math.min(11, S.x + dt * 1.6);
      world.fog.far = 45 - k * 30; world.background.lerp(new THREE.Color(0x0B0C26), dt * .8);
    }
    camera.position.x += (t.x - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y += (t.y - camera.position.y) * Math.min(1, dt * 4);
    camera.position.z += (t.z - camera.position.z) * Math.min(1, dt * 4);
    camLook.x += (t.lx - camLook.x) * Math.min(1, dt * 4);
    camLook.y += (t.ly - camLook.y) * Math.min(1, dt * 4);
    camera.lookAt(camLook);
  }
  renderer.render(world, camera);
  requestAnimationFrame(frame);
}

/* ───────────── 시작 ───────────── */
load('moon');
fadeIn();
requestAnimationFrame(frame);
window.__dream = { S, go };

</script>
